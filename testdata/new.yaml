openapi: 3.0.3
info:
  title: Demo API
  version: 1.1.0

paths:
  /users/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: currency
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                display_name:
                  type: string
                role:
                  type: string
      responses:
        "201":
          description: created

  /healthz:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

components:
  schemas:
    User:
      type: object
      required: [name]
      properties:
        id:
          type: string
        name:
          type: integer
        status:
          type: string
          enum: [ACTIVE]
