openapi: 3.0.0
info:
  title: Demo API
  version: 1.0.0

paths:
  /orders/{id}:
    get:
      operationId: OrdersController_findOne
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDto"
        "404":
          description: Order not found

  /orders:
    post:
      operationId: OrdersController_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDto"

components:
  schemas:
    OrderDto:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        total:
          type: number
        currency:
          type: string
          enum: [USD, EUR, GBP]
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - customerId
        - total
        - currency
        - status
        - createdAt

    CreateOrderDto:
      type: object
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            type: string
        currency:
          type: string
          enum: [USD, EUR, GBP]
        notes:
          type: string
          nullable: true
      required:
        - customerId
        - items
        - currency
