openapi: 3.0.1
info:
  title: Demo API
  version: v1

paths:
  /api/Products/{id}:
    get:
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
        "404":
          description: Not Found

  /api/Products:
    post:
      tags:
        - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
        "400":
          description: Bad Request

components:
  schemas:
    ProductDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          nullable: false
        price:
          type: number
          format: double
        category:
          type: string
          enum: [Electronics, Clothing, Books]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - price
        - createdAt

    CreateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
        category:
          type: string
          enum: [Electronics, Clothing, Food, Books]
      required:
        - name
        - price
        - category
