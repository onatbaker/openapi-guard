openapi: 3.1.0
info:
  title: Demo API
  version: 0.1.0

paths:
  /users/{id}:
    get:
      operationId: get_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /users:
    post:
      operationId: create_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

components:
  schemas:
    UserResponse:
      type: object
      title: UserResponse
      properties:
        id:
          type: string
        name:
          type: string
        email:
          anyOf:
            - type: string
            - type: "null"
        role:
          type: string
          enum: [admin, member, viewer]
      required:
        - id
        - name

    UserCreate:
      type: object
      title: UserCreate
      properties:
        name:
          type: string
        email:
          type: string
        role:
          anyOf:
            - type: string
            - type: "null"
      required:
        - name
        - email

    HTTPValidationError:
      type: object
      title: HTTPValidationError
      properties:
        detail:
          type: string
